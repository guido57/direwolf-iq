<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direwolf SDR Monitor</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #4CAF50; }
        
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .control-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
        input, select {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover { background: #45a049; }
        button.stop { background: #f44336; }
        button.stop:hover { background: #da190b; }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-top: 5px;
        }
        
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 1200px) {
            .panels { grid-template-columns: 1fr; }
        }
        
        .panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4CAF50;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .station-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .station-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr 1.5fr;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .station-item:hover { background: #333; }
        .station-header {
            font-weight: bold;
            color: #999;
            border-bottom: 2px solid #444;
        }
        .station-header div {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 14px;
        }
        .station-header div.sorted-asc::after,
        .station-header div.sorted-desc::after {
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #ccc;
        }
        .station-header div.sorted-asc::after { content: '▲'; }
        .station-header div.sorted-desc::after { content: '▼'; }
        .direct-badge {
            background: #4CAF50;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
        }
        .digipeated-badge {
            background: #FF9800;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
        }
        
        .packet-log {
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .packet-item {
            padding: 8px;
            border-bottom: 1px solid #333;
            line-height: 1.6;
        }
        .packet-time { color: #666; }
        .packet-sender { color: #4CAF50; font-weight: bold; }
        .packet-rssi { color: #2196F3; }
        .packet-snr { color: #FF9800; }
        
        .status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status.running { background: #4CAF50; animation: pulse 2s infinite; }
        .status.stopped { background: #666; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="status" id="status"></span>
            Direwolf SDR Monitor
        </h1>
        
        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label>Device</label>
                    <select id="device">
                        <option value="rtlsdr">RTL-SDR</option>
                        <option value="sdrplay">SDRplay / RSP1</option>
                        <option value="airspy">Airspy</option>
                        <option value="hackrf">HackRF</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Frequency (MHz)</label>
                    <input type="number" id="frequency" step="0.001" value="144.8">
                </div>
                <div class="control-group">
                    <label>Sample Rate (Hz)</label>
                    <input type="number" id="sample_rate" step="1000" value="1024000">
                </div>
                <div class="control-group">
                    <label>Gain (RTL-SDR: 0-50 higher=more, SDRplay IFGR: 20-59 lower=more)</label>
                    <input type="number" id="ifgr" min="0" max="59" value="40">
                    <small id="gainInfo" style="color:#999;font-size:11px;margin-top:2px;display:block;"></small>
                </div>
                <div class="control-group">
                    <label>RFGR (SDRplay only: 0-3, lower=more gain)</label>
                    <input type="number" id="rfgr" min="0" max="3" value="0">
                </div>
                <div class="control-group">
                    <label>Channel Bandwidth</label>
                    <select id="filter">
                        <option value="24k" selected>24 kHz (no extra LPF)</option>
                        <option value="12k">12 kHz</option>
                        <option value="8k">8 kHz</option>
                        <option value="6k">6 kHz</option>
                        <option value="4k">4 kHz</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>AGC</label>
                    <select id="agc">
                        <option value="false" selected>Off</option>
                        <option value="true">On</option>
                    </select>
                </div>
            </div>
            <div class="control-row">
                <button id="startBtn" onclick="startPipeline()">Start Pipeline</button>
                <button id="stopBtn" class="stop" onclick="stopPipeline()" disabled>Stop Pipeline</button>
                <button onclick="applySettings()">Apply Settings</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="packetsReceived">0</div>
                <div class="stat-label">Packets Received</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stationsHeard">0</div>
                <div class="stat-label">Stations Heard</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="directSenders">0</div>
                <div class="stat-label">Direct RF Senders</div>
            </div>
        </div>
        
        <div class="panel" style="margin-bottom: 20px;">
            <h2>Continuous RSSI Monitor (100ms samples) with Decoded Packets</h2>
            <div class="chart-container">
                <canvas id="continuousRssiChart"></canvas>
            </div>
        </div>
        
        <div class="panels">
            <div class="panel">
                <h2>Station List</h2>
                <div class="station-list">
                    <div class="station-item station-header">
                        <div data-sort-key="callsign" onclick="setStationSort('callsign')">Callsign</div>
                        <div data-sort-key="rssi" onclick="setStationSort('rssi')">RSSI</div>
                        <div data-sort-key="snr" onclick="setStationSort('snr')">SNR</div>
                        <div data-sort-key="count" onclick="setStationSort('count')">Count</div>
                        <div data-sort-key="last_seen" onclick="setStationSort('last_seen')">Last Heard</div>
                        <div data-sort-key="via" onclick="setStationSort('via')">Via</div>
                    </div>
                    <div id="stationList"></div>
                </div>
            </div>
            <div class="panel">
                <h2>Recent Packets</h2>
                <div class="packet-log" id="packetLog"></div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let continuousRssiChart;
        // Station list state for client-side sorting
        let stationData = [];
        let stationSortKey = 'callsign';
        let stationSortDir = 'asc';  // 'asc' or 'desc'

        function normalizeCallsignForSort(callsign) {
            if (!callsign) return '';
            let t = String(callsign).trim();
            // Strip leading bracketed tag like "[0L] " or "[ig] "
            if (t.startsWith('[')) {
                const spaceIdx = t.indexOf(' ');
                if (spaceIdx > 0) {
                    t = t.slice(spaceIdx + 1).trim();
                }
            }
            return t.toUpperCase();
        }
        
        // Custom plugin to draw callsign labels below packet markers with collision avoidance
        const packetLabelPlugin = {
            id: 'packetLabels',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                const meta = chart.getDatasetMeta(1); // packet markers dataset
                if (!meta || !meta.data) return;
                
                const dataset = chart.data.datasets[1];
                const infoArr = dataset._packetInfo || [];
                
                ctx.save();
                ctx.font = '10px monospace';
                ctx.fillStyle = '#FFEB3B';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                // Collect all label positions with their info
                const labels = [];
                meta.data.forEach((point, index) => {
                    if (!point || isNaN(dataset.data[index])) return;
                    const info = infoArr[index];
                    if (!info) return;
                    
                    const callsign = info.callsign || '';
                    const via = info.via || '';
                    
                    // Measure actual text width
                    const callsignWidth = ctx.measureText(callsign).width;
                    const viaWidth = ctx.measureText(via).width;
                    const labelWidth = Math.max(callsignWidth, viaWidth);
                    
                    labels.push({
                        x: point.x,
                        yOffset: 0, // Will be adjusted for collisions
                        callsign,
                        via,
                        width: labelWidth,
                        height: 24 // Two lines of text
                    });
                });
                
                // Sort labels by x position (left to right)
                labels.sort((a, b) => a.x - b.x);
                
                // Track occupied regions at each vertical level
                const levels = [[]]; // levels[0] = array of {xMin, xMax} for level 0
                const minSpacing = 8; // Minimum horizontal gap between labels
                
                // Assign each label to the lowest available level
                labels.forEach(label => {
                    const labelLeft = label.x - label.width / 2 - minSpacing / 2;
                    const labelRight = label.x + label.width / 2 + minSpacing / 2;
                    
                    // Find the lowest level where this label fits
                    let assignedLevel = -1;
                    for (let level = 0; level < levels.length; level++) {
                        let fits = true;
                        for (const occupied of levels[level]) {
                            if (labelLeft < occupied.xMax && labelRight > occupied.xMin) {
                                fits = false;
                                break;
                            }
                        }
                        if (fits) {
                            assignedLevel = level;
                            break;
                        }
                    }
                    
                    // If no level works, create a new one
                    if (assignedLevel === -1) {
                        assignedLevel = levels.length;
                        levels.push([]);
                    }
                    
                    // Mark this region as occupied
                    levels[assignedLevel].push({ xMin: labelLeft, xMax: labelRight });
                    label.yOffset = assignedLevel * 24;
                });
                
                // Draw all labels with their adjusted positions
                const yBottom = chart.chartArea.bottom;
                labels.forEach(label => {
                    ctx.fillText(label.callsign, label.x, yBottom + 2 + label.yOffset);
                    ctx.fillText(label.via, label.x, yBottom + 13 + label.yOffset);
                });
                
                ctx.restore();
            }
        };
        
        // Continuous RSSI chart (100ms samples, show time in tooltip) + packet markers
        continuousRssiChart = new Chart(document.getElementById('continuousRssiChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'RSSI (dBFS)',
                    data: [],
                    // parallel array to hold timestamps for tooltips
                    _timestamps: [],
                    borderColor: '#00BCD4',
                    backgroundColor: 'rgba(0, 188, 212, 0.1)',
                    borderWidth: 1,
                    pointRadius: 0,  // No points for smooth line
                    fill: true
                }, {
                    label: 'Packets',
                    data: [],                // aligned with labels; NaN except at packet points
                    _packetInfo: [],         // per-index meta: {rssi, callsign, via, timeStr}
                    borderColor: '#FFEB3B',
                    backgroundColor: '#FFEB3B',
                    showLine: false,
                    pointRadius: 3,
                    pointHoverRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                layout: {
                    padding: {
                        bottom: 80  // Space for callsign/via labels (allow for stacking)
                    }
                },
                scales: {
                    x: { display: false },
                    y: { 
                        ticks: { color: '#999' },
                        grid: { color: '#333' },
                        title: {
                            display: true,
                            text: 'RSSI (dBFS)',
                            color: '#999'
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => {
                                if (ctx.dataset.label === 'Packets') {
                                    const infoArr = ctx.dataset._packetInfo || [];
                                    const info = infoArr[ctx.dataIndex];
                                    if (!info) return '';
                                    const rssiStr = `RSSI: ${Number(info.rssi).toFixed(1)} dBFS`;
                                    return [
                                        rssiStr,
                                        `Callsign: ${info.callsign || '-'}`,
                                        `Via: ${info.via || '-'}`,
                                        `Time: ${info.timeStr || '-'}`
                                    ];
                                } else {
                                    const tsArr = ctx.dataset._timestamps || [];
                                    const ts = tsArr[ctx.dataIndex];
                                    const tStr = ts ? new Date(ts).toLocaleTimeString() : '';
                                    const rssiStr = `RSSI: ${ctx.parsed.y.toFixed(1)} dBFS`;
                                    return tStr ? `${rssiStr}  •  ${tStr}` : rssiStr;
                                }
                            }
                        }
                    }
                }
            },
            plugins: [packetLabelPlugin]
        });
        
        // Helpers
        function deriveViaFromPacket(packet) {
            // Prefer backend logic used by Station List
            if (packet && typeof packet.direct === 'boolean') {
                if (packet.direct) return 'Direct';
                if (packet.last_digipeater) return packet.last_digipeater;
            }
            // Fallback: parse from path (last hop with *)
            const path = packet && packet.path ? String(packet.path) : '';
            if (!path) return 'Direct';
            const parts = path.split(',');
            for (let i = parts.length - 1; i >= 0; i--) {
                const p = parts[i];
                if (p.includes('*')) return p.replace('*', '');
            }
            return 'Direct';
        }

        // Socket events
        socket.on('new_packet', (packet) => {
            addPacketToLog(packet);
            if (packet.rssi !== undefined && packet.rssi !== null) {
                // Add marker on the continuous RSSI chart at peak position
                addPacketMarkerToRssiChart(packet);
            }
        });
        
        socket.on('continuous_rssi', (data) => {
            // Add continuous RSSI sample (100ms interval)
            const ds = continuousRssiChart.data.datasets[0];     // line dataset
            const pkt = continuousRssiChart.data.datasets[1];     // packet markers
            continuousRssiChart.data.labels.push('');
            ds.data.push(data.value);
            ds._timestamps.push(data.time);
            // keep overlay arrays aligned
            pkt.data.push(NaN);
            pkt._packetInfo.push(null);
            
            // Keep last 600 samples (60 seconds at 100ms)
            if (continuousRssiChart.data.labels.length > 600) {
                continuousRssiChart.data.labels.shift();
                ds.data.shift();
                ds._timestamps.shift();
                pkt.data.shift();
                pkt._packetInfo.shift();
            }
            continuousRssiChart.update('none');
        });

        // Map packet events to peak RSSI in window around packet timestamp
        function addPacketMarkerToRssiChart(packet) {
            const ds = continuousRssiChart.data.datasets[0];
            const pkt = continuousRssiChart.data.datasets[1];
            if (!ds._timestamps || ds._timestamps.length === 0) return;
            if (packet.rssi === undefined || packet.rssi === null) return;
            
            const tsTarget = Date.parse(packet.timestamp);
            if (isNaN(tsTarget)) return;
            
            // Find the closest timestamp index
            let centerIdx = -1;
            let bestDelta = Infinity;
            for (let i = 0; i < ds._timestamps.length; i++) {
                const t = Date.parse(ds._timestamps[i]);
                if (isNaN(t)) continue;
                const d = Math.abs(t - tsTarget);
                if (d < bestDelta) {
                    bestDelta = d;
                    centerIdx = i;
                }
            }
            // Require a reasonably close match (<= 500 ms)
            if (centerIdx === -1 || bestDelta > 500) return;
            
            // Search for peak RSSI in a window: ±500ms (~±5 samples at 100ms)
            const windowSize = 5;
            const startIdx = Math.max(0, centerIdx - windowSize);
            const endIdx = Math.min(ds.data.length - 1, centerIdx + windowSize);
            
            let peakIdx = centerIdx;
            let peakValue = ds.data[centerIdx];
            for (let i = startIdx; i <= endIdx; i++) {
                const val = ds.data[i];
                if (!isNaN(val) && val > peakValue) {
                    peakValue = val;
                    peakIdx = i;
                }
            }
            
            // Place marker at peak position with measured RSSI value from packet
            pkt.data[peakIdx] = peakValue;  // Use peak value for Y position
            const via = deriveViaFromPacket(packet);
            pkt._packetInfo[peakIdx] = {
                rssi: Number(packet.rssi),  // Keep direwolf's reported RSSI in tooltip
                callsign: packet.sender || '-',
                via,
                timeStr: packet.timestamp ? new Date(packet.timestamp).toLocaleTimeString() : '-'
            };
            
            continuousRssiChart.update('none');
        }
        
        socket.on('stats_update', (stats) => {
            document.getElementById('packetsReceived').textContent = stats.packets_received;
            document.getElementById('stationsHeard').textContent = stats.stations_heard;
            document.getElementById('directSenders').textContent = stats.direct_rf_senders;
            updatePipelineStatus(stats.pipeline_running);
        });
        
        // obsolete: updateChart replaced by pushChartPoint
        
        function addPacketToLog(packet) {
            const log = document.getElementById('packetLog');
            const time = new Date(packet.timestamp).toLocaleTimeString();
            const rssi = packet.rssi ? `RSSI=${packet.rssi.toFixed(1)}` : '';
            const snr = packet.snr ? `SNR=${packet.snr.toFixed(1)}` : '';
            
            // Build full APRS packet string
            const fullPacket = `${packet.sender}>${packet.path}:${packet.message}`;
            
            const item = document.createElement('div');
            item.className = 'packet-item';
            item.innerHTML = `
                <span class="packet-time">[${time}]</span>
                ${packet.rssi ? `<span class="packet-rssi">${rssi}</span>` : ''}
                ${packet.snr ? `<span class="packet-snr">${snr}</span>` : ''}
                <br><span style="color:#4CAF50">${fullPacket}</span>
            `;
            log.insertBefore(item, log.firstChild);
            if (log.children.length > 500) log.removeChild(log.lastChild);
        }
        
        function updatePipelineStatus(running) {
            const status = document.getElementById('status');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            if (running) {
                status.className = 'status running';
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } else {
                status.className = 'status stopped';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }
        
        function readConfigFromForm() {
            return {
                device: document.getElementById('device').value,
                frequency: parseFloat(document.getElementById('frequency').value),
                sample_rate: parseInt(document.getElementById('sample_rate').value),
                ifgr: parseInt(document.getElementById('ifgr').value),
                rfgr: parseInt(document.getElementById('rfgr').value),
                agc: document.getElementById('agc').value === 'true',
                filter_quality: document.getElementById('filter').value
            };
        }

        async function pushConfig(config) {
            const response = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });
            return response.json();
        }

        async function startPipeline() {
            // Always push current UI settings before starting
            const cfg = readConfigFromForm();
            const cfgResp = await pushConfig(cfg);
            if (!cfgResp.success) {
                alert('Failed to apply settings: ' + cfgResp.error);
                return;
            }
            const response = await fetch('/api/pipeline/start', { method: 'POST' });
            const data = await response.json();
            if (!data.success) alert('Failed to start: ' + data.error);
        }

        async function stopPipeline() {
            const response = await fetch('/api/pipeline/stop', { method: 'POST' });
            const data = await response.json();
            if (!data.success) alert('Failed to stop: ' + data.error);
        }

        async function applySettings() {
            const config = readConfigFromForm();
            const data = await pushConfig(config);
            if (data.success) {
                alert('Settings applied! Pipeline will restart if running.');
            } else if (data.error) {
                alert('Failed to apply settings: ' + data.error);
            }
        }

        function updateStationHeaderSortIndicators() {
            const header = document.querySelector('.station-item.station-header');
            if (!header) return;
            const cells = header.querySelectorAll('div[data-sort-key]');
            cells.forEach(cell => {
                cell.classList.remove('sorted-asc', 'sorted-desc');
                const key = cell.getAttribute('data-sort-key');
                if (key === stationSortKey) {
                    cell.classList.add(stationSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        function setStationSort(key) {
            if (stationSortKey === key) {
                // Toggle direction
                stationSortDir = stationSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                stationSortKey = key;
                // Default direction depends on column type
                if (key === 'rssi' || key === 'snr' || key === 'count' || key === 'last_seen') {
                    // For numeric / time columns, show highest / newest first by default
                    stationSortDir = 'desc';
                } else {
                    // Text columns default to A->Z
                    stationSortDir = 'asc';
                }
            }
            renderStations();
        }

        function renderStations() {
            const list = document.getElementById('stationList');
            if (!list) return;

            const data = [...stationData];

            const key = stationSortKey;
            const dir = stationSortDir === 'asc' ? 1 : -1;

            data.sort((a, b) => {
                let va, vb;
                // Primary key comparison
                if (key === 'rssi' || key === 'snr' || key === 'count') {
                    va = a[key];
                    vb = b[key];
                    const aMissing = (va === null || va === undefined);
                    const bMissing = (vb === null || vb === undefined);
                    if (!aMissing || !bMissing) {
                        if (aMissing) return 1;   // missing -> bottom
                        if (bMissing) return -1;
                        const nva = Number(va);
                        const nvb = Number(vb);
                        if (nva < nvb) return -1 * dir;
                        if (nva > nvb) return 1 * dir;
                    }
                } else if (key === 'last_seen') {
                    va = a.last_seen || '';
                    vb = b.last_seen || '';
                    if (va || vb) {
                        if (!va) return 1;   // missing -> bottom
                        if (!vb) return -1;
                        if (va < vb) return -1 * dir;
                        if (va > vb) return 1 * dir;
                    }
                } else if (key === 'via') {
                    va = (a.via || '').toUpperCase();
                    vb = (b.via || '').toUpperCase();
                    if (va < vb) return -1 * dir;
                    if (va > vb) return 1 * dir;
                } else { // 'callsign' or default
                    va = normalizeCallsignForSort(a.callsign);
                    vb = normalizeCallsignForSort(b.callsign);
                    if (va < vb) return -1 * dir;
                    if (va > vb) return 1 * dir;
                }

                // Tie-breaker: always callsign A->Z, then via A->Z
                const ca = normalizeCallsignForSort(a.callsign);
                const cb = normalizeCallsignForSort(b.callsign);
                if (ca < cb) return -1;
                if (ca > cb) return 1;
                const vaStr = (a.via || '').toUpperCase();
                const vbStr = (b.via || '').toUpperCase();
                if (vaStr < vbStr) return -1;
                if (vaStr > vbStr) return 1;
                return 0;
            });

            list.innerHTML = data.map(s => {
                const lastHeard = s.last_seen ? new Date(s.last_seen).toLocaleTimeString() : '-';
                const isDirect = (s.via === 'Direct');
                return `
                <div class="station-item">
                    <div>${s.callsign}</div>
                    <div>${s.rssi !== null && s.rssi !== undefined ? s.rssi.toFixed(1) : '-'}</div>
                    <div>${s.snr !== null && s.snr !== undefined ? s.snr.toFixed(1) : '-'}</div>
                    <div>${s.count}</div>
                    <div style="color:#999;font-size:12px">${lastHeard}</div>
                    <div>
                        <span class="${isDirect ? 'direct-badge' : 'digipeated-badge'}">
                            ${s.via}
                        </span>
                    </div>
                </div>
                `;
            }).join('');

            updateStationHeaderSortIndicators();
        }
        
        async function loadStations() {
            const response = await fetch('/api/stations');
            const stations = await response.json();
            stationData = Array.isArray(stations) ? stations : [];
            renderStations();
        }
        
        async function loadPackets() {
            try {
                const response = await fetch('/api/packets');
                const packets = await response.json();
                const log = document.getElementById('packetLog');
                
                if (!log) {
                    console.error('Packet log element not found');
                    return;
                }
                
                // Clear existing packets
                log.innerHTML = '';
                
                // Load packets in reverse order (newest first)
                // API returns oldest first in the deque, so reverse to show newest at top
                for (let i = packets.length - 1; i >= 0; i--) {
                    const packet = packets[i];
                    const time = new Date(packet.timestamp).toLocaleTimeString();
                    const rssi = packet.rssi ? `RSSI=${packet.rssi.toFixed(1)}` : '';
                    const snr = packet.snr ? `SNR=${packet.snr.toFixed(1)}` : '';
                    
                    // Build full APRS packet string
                    const fullPacket = `${packet.sender}>${packet.path}:${packet.message}`;
                    
                    const item = document.createElement('div');
                    item.className = 'packet-item';
                    item.innerHTML = `
                        <span class="packet-time">[${time}]</span>
                        ${packet.rssi ? `<span class="packet-rssi">${rssi}</span>` : ''}
                        ${packet.snr ? `<span class="packet-snr">${snr}</span>` : ''}
                        <br><span style="color:#4CAF50">${fullPacket}</span>
                    `;
                    log.appendChild(item);
                }
                
                console.log(`Loaded ${packets.length} historical packets`);
            } catch (e) {
                console.error('Failed to load packets', e);
            }
        }
        
        // Periodic updates
        setInterval(loadStations, 5000);
        setInterval(async () => {
            const response = await fetch('/api/stats');
            const stats = await response.json();
            updatePipelineStatus(stats.pipeline_running);
        }, 2000);
        
        // Initial load
        function updateGainInfo() {
            const device = document.getElementById('device').value;
            const ifgr = parseInt(document.getElementById('ifgr').value);
            const rfgr = parseInt(document.getElementById('rfgr').value);
            const gainInfoEl = document.getElementById('gainInfo');
            
            if (device === 'sdrplay') {
                // SDRplay: IFGR 20-59, actual gain ≈ (59 - IFGR) dB
                const approxGain = 59 - ifgr;
                const rfgrNote = rfgr === 0 ? ' (max RF gain)' : ` (RF -${rfgr * 3}dB)`;
                gainInfoEl.textContent = `≈ ${approxGain} dB total${rfgrNote}`;
                gainInfoEl.style.display = 'block';
            } else if (device === 'rtlsdr') {
                gainInfoEl.textContent = `TUNER gain (will snap to nearest supported value)`;
                gainInfoEl.style.display = 'block';
            } else {
                gainInfoEl.style.display = 'none';
            }
        }

        async function loadPreset(device) {
            try {
                const response = await fetch(`/api/preset/${device}`);
                if (!response.ok) {
                    console.log(`No preset found for ${device}`);
                    return false;
                }
                const data = await response.json();
                if (data.success && data.config) {
                    const cfg = data.config;
                    document.getElementById('frequency').value = cfg.frequency || 144.8;
                    document.getElementById('sample_rate').value = cfg.sample_rate || 1024000;
                    document.getElementById('ifgr').value = cfg.ifgr || 40;
                    document.getElementById('rfgr').value = cfg.rfgr || 0;
                    document.getElementById('agc').value = String(cfg.agc || false);
                    document.getElementById('filter').value = cfg.filter_quality || '24k';
                    updateGainInfo();
                    console.log(`Loaded preset for ${device}:`, cfg);
                    return true;
                }
            } catch (e) {
                console.error(`Failed to load preset for ${device}`, e);
            }
            return false;
        }

        async function onDeviceChange() {
            const device = document.getElementById('device').value;
            // Try to load preset; if none exists, just update gain info
            await loadPreset(device);
            updateGainInfo();
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const cfg = await response.json();
                const device = cfg.device || 'rtlsdr';
                document.getElementById('device').value = device;

                // Prefer preset values from the device .conf file on initial load.
                const usedPreset = await loadPreset(device);

                if (!usedPreset) {
                    // Fallback: use config values from backend
                    document.getElementById('frequency').value = cfg.frequency || 144.8;
                    document.getElementById('sample_rate').value = cfg.sample_rate || 1024000;
                    document.getElementById('ifgr').value = cfg.ifgr || 40;
                    document.getElementById('rfgr').value = cfg.rfgr || 0;
                    document.getElementById('agc').value = String(cfg.agc || false);
                    document.getElementById('filter').value = cfg.filter_quality || '24k';
                }
                updateGainInfo();
            } catch (e) {
                console.error('Failed to load config', e);
            }
        }

        // Update gain info when device or gain changes
        document.getElementById('device').addEventListener('change', onDeviceChange);
        document.getElementById('ifgr').addEventListener('input', updateGainInfo);
        document.getElementById('rfgr').addEventListener('input', updateGainInfo);

        loadConfig();
        loadStations();
        loadPackets();
    </script>
</body>
</html>
