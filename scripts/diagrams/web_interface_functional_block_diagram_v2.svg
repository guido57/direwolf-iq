<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .title { font: 700 22px sans-serif; fill: #111; }
      .subtitle { font: 14px sans-serif; fill: #333; }
      .laneTitle { font: 700 14px sans-serif; fill: #111; }
      .lane { fill: #fafafa; stroke: #cfcfcf; stroke-width: 1; }

      .box { fill: #fff; stroke: #222; stroke-width: 1.2; rx: 10; ry: 10; }
      .box2 { fill: #fff; stroke: #444; stroke-width: 1.2; rx: 10; ry: 10; }
      .box3 { fill: #fff; stroke: #666; stroke-width: 1.2; rx: 10; ry: 10; }

      .boxTitle { font: 700 13px sans-serif; fill: #111; }
      .boxText { font: 12px sans-serif; fill: #111; }
      .small { font: 11px sans-serif; fill: #222; }
      .muted { font: 11px sans-serif; fill: #555; }

      .arrow { stroke: #111; stroke-width: 1.4; fill: none; }
      .arrowMuted { stroke: #666; stroke-width: 1.2; fill: none; }
      .arrowBold { stroke: #111; stroke-width: 3.2; fill: none; }
      .label { font: 12px sans-serif; fill: #111; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#111" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#666" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="40" class="title">Direwolf-IQ: web_interface.py — Functional Block Diagram (Simplified)</text>
  <text x="40" y="66" class="subtitle">Focus: routes, Socket.IO, background threads, and the subprocess/FIFO data paths.</text>

  <!-- Swimlanes -->
  <rect x="30" y="95" width="1540" height="215" class="lane"/>
  <text x="45" y="120" class="laneTitle">Browser (scripts/templates/index.html)</text>

  <rect x="30" y="325" width="1540" height="355" class="lane"/>
  <text x="45" y="350" class="laneTitle">Python server (scripts/web_interface.py)</text>

  <rect x="30" y="695" width="1540" height="305" class="lane"/>
  <text x="45" y="720" class="laneTitle">External pipeline + named pipe</text>

  <!-- Browser lane -->
  <rect x="60" y="145" width="520" height="145" class="box"/>
  <text x="80" y="170" class="boxTitle">Browser UI (main thread)</text>
  <text x="80" y="195" class="boxText">HTTP polling: /api/stats, /api/stations, /api/packets</text>
  <text x="80" y="217" class="boxText">UI actions: POST /api/pipeline/start, POST /api/pipeline/stop</text>
  <text x="80" y="239" class="boxText">Socket.IO client: receives new_packet, stats_update, continuous_rssi</text>
  <text x="80" y="261" class="small">Fallback: GET /api/continuous_rssi when WS stalls</text>

  <!-- Server lane: Flask routes -->
  <rect x="60" y="380" width="520" height="275" class="box2"/>
  <text x="80" y="405" class="boxTitle">Server main thread: Flask routes</text>
  <text x="80" y="430" class="boxText">Pipeline control: POST /api/pipeline/start, POST /api/pipeline/stop</text>
  <text x="80" y="452" class="boxText">Data endpoints: GET /api/stats, /api/stations, /api/packets</text>
  <text x="80" y="474" class="boxText">RSSI fallback: GET /api/continuous_rssi</text>
  <text x="80" y="496" class="boxText">Config/presets: GET/POST /api/config, GET /api/preset/&lt;device&gt;</text>
  <text x="80" y="526" class="muted">Writes/reads shared state: stats, pipeline_running, pipeline_process, config</text>

  <!-- Server lane: Socket.IO -->
  <rect x="620" y="380" width="440" height="275" class="box2"/>
  <text x="640" y="405" class="boxTitle">Server main thread: Socket.IO</text>
  <text x="640" y="430" class="boxText">on connect → ensure continuous_rssi_monitor started</text>
  <text x="640" y="452" class="boxText">emit stats_update</text>
  <text x="640" y="474" class="boxText">emit new_packet</text>
  <text x="640" y="496" class="boxText">emit continuous_rssi</text>
  <text x="640" y="526" class="muted">Emits are called from background threads too</text>

  <!-- Server lane: background threads -->
  <rect x="1090" y="380" width="460" height="125" class="box2"/>
  <text x="1110" y="405" class="boxTitle">Background thread: packet parser (pipeline_reader)</text>
  <text x="1110" y="430" class="boxText">Reads Direwolf stdout lines</text>
  <text x="1110" y="452" class="boxText">Parses packets/audio → updates stats['last_packets']</text>
  <text x="1110" y="474" class="boxText">Triggers Socket.IO emits: new_packet, stats_update</text>

  <rect x="1090" y="530" width="460" height="125" class="box2"/>
  <text x="1110" y="555" class="boxTitle">Background thread: RSSI monitor (continuous_rssi_monitor)</text>
  <text x="1110" y="580" class="boxText">Reads CF32 IQ from FIFO (100ms chunks)</text>
  <text x="1110" y="602" class="boxText">Computes mean power → dBFS RSSI</text>
  <text x="1110" y="624" class="boxText">Triggers Socket.IO emits: continuous_rssi</text>

  <!-- External lane -->
  <rect x="60" y="750" width="720" height="200" class="box3"/>
  <text x="80" y="775" class="boxTitle">Subprocess pipeline (spawned by start_pipeline)</text>
  <text x="80" y="800" class="boxText">SDR source → csdr decimate → tee → direwolf (iq:&lt;rate&gt;)</text>
  <text x="80" y="822" class="small">tee writes a copy of IQ to /tmp/direwolf_iq_monitor.fifo</text>
  <text x="80" y="844" class="small">Direwolf stdout is consumed by pipeline_reader()</text>

  <rect x="820" y="750" width="730" height="200" class="box3"/>
  <text x="840" y="775" class="boxTitle">Named pipe / FIFO</text>
  <text x="840" y="800" class="boxText">/tmp/direwolf_iq_monitor.fifo</text>
  <text x="840" y="822" class="small">Writer: tee (in pipeline)</text>
  <text x="840" y="844" class="small">Reader: continuous_rssi_monitor (blocking read)</text>
  <text x="840" y="866" class="small">keepalive_fd helps prevent writer EPIPE</text>

  <!-- Arrows: browser <-> server -->
  <path d="M320 290 L320 380" class="arrow" marker-end="url(#arrow)"/>
  <text x="215" y="335" class="label">HTTP requests</text>

  <path d="M580 230 L620 230 L620 405" class="arrow" marker-end="url(#arrow)"/>
  <text x="585" y="215" class="label">Socket.IO connect</text>

  <path d="M620 480 L580 480 L580 230" class="arrow" marker-end="url(#arrow)"/>
  <text x="435" y="470" class="label">Socket.IO events to browser</text>

  <!-- Arrows: start/stop spawns pipeline -->
  <path d="M320 655 L320 750" class="arrow" marker-end="url(#arrow)"/>
  <text x="160" y="705" class="label">start/stop pipeline</text>

  <!-- Arrows: pipeline -> FIFO (IQ copy) -->
  <path d="M780 850 L820 850" class="arrowBold" marker-end="url(#arrow)"/>
  <text x="800" y="835" class="label" text-anchor="middle">IQ bytes (CF32)</text>

  <!-- Arrows: FIFO -> RSSI thread -->
  <path d="M1185 750 L1320 655" class="arrowBold" marker-end="url(#arrow)"/>
  <text x="1245" y="735" class="label">FIFO read</text>

  <!-- Arrows: Direwolf stdout -> packet parser -->
  <path d="M420 750 L1090 442" class="arrowMuted" marker-end="url(#arrowMuted)"/>
  <text x="545" y="705" class="label">Direwolf stdout</text>

  <!-- Arrows: both background threads trigger emits via Socket.IO -->
  <path d="M1090 462 L1060 462" class="arrowMuted" marker-end="url(#arrowMuted)"/>
  <text x="950" y="448" class="label">emit new_packet / stats_update</text>

  <path d="M1090 612 L1060 512" class="arrowMuted" marker-end="url(#arrowMuted)"/>
  <text x="910" y="600" class="label">emit continuous_rssi</text>

  <!-- Footer -->
  <text x="40" y="1035" class="muted">LibreOffice Draw: open SVG to edit shapes/connectors.</text>
</svg>
