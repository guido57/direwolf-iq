#################################################################
#                                                               #
#     Configuration file for RTL-SDR with SoapySDR            #
#                                                               #
#################################################################

# Device selection
DEVICE driver=rtlsdr

# Frequency in MHz
FREQUENCY 144.800

# Sample rate in Hz (RTL-SDR supports: 250k, 1M, 1.024M, 1.536M, 1.792M, 1.92M, 2.048M, 2.16M, 2.56M)
# Use 1.024M for compatibility with csdr decimation
# SAMPLE_RATE 1024000
SAMPLE_RATE 2048000

# Default channel bandwidth mode for web_interface (24k,12k,8k,6k,4k)
BANDWIDTH 24k

# Automatic Gain Control (AGC)
AGC false

# RTL-SDR Gain (0-50 dB)
GAIN TUNER 35.0

# Disable offset tuning (improves noise floor by ~10-15 dB)
SETTING offset_tune false
